# ─────────────────────────────────────────────────────────────
#  CRONOLOGIA DELLA CASA — eventi della linea del tempo
# ─────────────────────────────────────────────────────────────
#  Come modificare:
#  • Ogni evento comincia con "- id:" e compare come una chiave
#    sulla linea del tempo, nell'ordine in cui è scritto qui.
#  • rilievo: maggiore  → chiave grande viola sopra la linea
#    rilievo: minore    → chiave piccola dorata sotto la linea
#  • personaggi e luoghi usano gli "id" dei file
#    personaggi.yaml e luoghi.yaml (es. [gwen, humphrey]).
#  • Nei testi puoi scrivere [[gwen]] o [[wallford]] per creare
#    un collegamento cliccabile, **grassetto** e *corsivo*.
#  • campagna: testo libero che appare in un riquadro
#    "Nella nostra Saga" — usalo per ciò che è successo
#    al vostro tavolo. Lascialo vuoto o toglilo se non serve.
#  • Attenzione all'indentazione: usa sempre spazi, mai tab.
# ─────────────────────────────────────────────────────────────

epoche:
  - nome: Impero di Oberon Trismegisto
    da: esilio-boggart
    a: arcadia-imperatrice
  - nome: Prima Guerra Domiciliare
    da: patto-restaurazione
    a: alto-consiglio
  - nome: Fragile Pace
    da: apertura-frontiere
    a: caduta-faeriyev

eventi:

  # ── STORIA DELLA CASA ─────────────────────────────────────

  - id: scomparsa-padrone
    data: 0 s.P.
    titolo: La Scomparsa del Padrone
    rilievo: maggiore
    riassunto: |
      Il Padrone e la sua Famiglia svaniscono senza spiegazione. [[big-ben]] Hearthworth se ne accorge per primo e, insieme agli altri Boggart, giura di custodire la Casa così com'è finché il Padrone non farà ritorno. Da questo giorno si contano gli anni "senza Padrone" (s.P.).
    personaggi: [big-ben]
    luoghi: [salone]

  - id: colonizzazione-sprighi
    data: 8 s.P.
    titolo: La Colonizzazione degli Sprighi
    rilievo: minore
    riassunto: |
      Gli Sprighi, con [[paracelso]] alla guida, si prendono il Primo Piano e iniziano a edificare quelli che diventeranno i Liberi Domini, senza curarsi delle proteste dei Boggart.
    personaggi: [paracelso]
    luoghi: [liberi-domini, beddingham]

  - id: guerra-due-popoli
    data: 12–20 s.P.
    titolo: La Guerra dei Due Popoli
    rilievo: minore
    riassunto: |
      I Boggart muovono guerra agli Sprighi. Dopo anni di battaglie e tregue riescono a chiuderli dentro [[beddingham]]. Per evitare un assedio sanguinoso, [[big-ben]] concede a [[paracelso]] tre giorni per arrendersi.
    personaggi: [big-ben, paracelso]
    luoghi: [beddingham]

  - id: esodo-fate
    data: 20 s.P.
    titolo: L'Esodo delle Fate
    rilievo: minore
    riassunto: |
      Un fulmine colpisce Déndronaos, l'albero millenario dove vivevano le Fate, e le costringe a migrare. Guidate dallo Zar [[oberon]] raggiungono la Grande Finestra della Sala da Pranzo e lì fondano il loro nuovo Reame.
    personaggi: [oberon]
    luoghi: [domini-esterni, faeriyev, reame]

  - id: grande-scala
    data: 21 s.P.
    titolo: La Battaglia della Grande Scala
    rilievo: minore
    riassunto: |
      [[big-ben]] propone a [[paracelso]] di dimenticare i vecchi rancori e di allearsi contro l'esercito delle Fate invasore. Lo Sprigo però si è già accordato con [[oberon]]: stretti tra due eserciti, i Boggart vengono massacrati e Big Ben cade in battaglia. La Casa lo ricorda come **il Grande Tradimento**.
    personaggi: [big-ben, paracelso, oberon]
    luoghi: [grande-scala]

  - id: esilio-boggart
    data: 23 s.P.
    titolo: L'Esilio dei Boggart
    rilievo: maggiore
    riassunto: |
      I Boggart che non rinunciano alla loro causa vengono cacciati nei Domini Esterni. Alcune famiglie scelgono invece di inginocchiarsi e restare, lontano dal Salone. Ha inizio l'Impero di [[oberon]] detto Trismegisto.
    personaggi: [oberon]
    luoghi: [domini-esterni, salone]

  - id: samhain
    data: 51 s.P.
    titolo: Il Giorno di Samhain
    rilievo: maggiore
    riassunto: |
      Il 1° novembre le 27 tribù degli Sluagh di Oltrelontano entrano nella Casa risalendo dalle Tubature e cominciano a saccheggiarla. [[oberon]] manda il suo esercito a fermarli, ma le Fate vengono decimate: è **la Caccia Selvaggia**. Nasce così l'Orda, padrona della Cantina.
    personaggi: [oberon]
    luoghi: [cantina, orda]

  - id: patto-restaurazione
    data: 74 s.P.
    titolo: Il Patto di Restaurazione
    rilievo: maggiore
    riassunto: |
      In difficoltà contro gli Sluagh, [[oberon]] offre ai Boggart un nuovo accordo: se li aiuteranno, al ritorno del Padrone le Fate riporteranno la Casa allo stato originale e se ne andranno per sempre. I Boggart rientrano al Focolare guidati da [[william-hearthworth]], nipote di Big Ben. Comincia la Prima Guerra Domiciliare.
    personaggi: [oberon, william-hearthworth]
    luoghi: [focolare, salone]

  - id: assassinio-oberon
    data: 83 s.P.
    titolo: L'Assassinio di Oberon
    rilievo: minore
    riassunto: |
      L'Imperatore [[oberon]] Trismegisto viene ucciso in circostanze misteriose. Inizia la difficile ricerca di un erede tra le poche Fate di stirpe imperiale sopravvissute alla caduta di Déndronaos.
    personaggi: [oberon]
    luoghi: [astraviya]

  - id: arcadia-imperatrice
    data: 84 s.P.
    titolo: Arcadia Imperatrice
    rilievo: minore
    riassunto: |
      La corona viene offerta prima al Generale [[ludmillen]], che la rifiuta. La scelta cade allora, a sorpresa, sulla giovane [[arcadia]], figlia di Oberon: diventa Zarina del Reame e Imperatrice della Casa.
    personaggi: [arcadia, ludmillen]
    luoghi: [astraviya, reame]

  - id: rivolta-tristellati
    data: 87 s.P.
    titolo: La Rivolta dei Tristellati
    rilievo: minore
    riassunto: |
      Con l'Editto "Fratelli!" [[arcadia]] proclama che tutti gli omini sono un'unica stirpe. Una parte del Grande Esercito Imperiale non lo accetta: sono i **Tristellati**, che occupano il Pianoforte e perseguitano chi non è Fata, finché il giovane [[tristan-des-larmes]], la Fata Nera, non li sconfigge.
    personaggi: [arcadia, tristan-des-larmes]
    luoghi: [tournoire, mont-guignol]

  - id: acquapenna
    data: 89–91 s.P.
    titolo: La Battaglia di Acquapenna
    rilievo: minore
    riassunto: |
      Un Cigno colossale si impadronisce dei Domini Esterni e minaccia la Casa. [[arcadia]] chiede e ottiene una tregua: per la prima volta tutti i Popoli combattono in un unico esercito contro un nemico comune.
    personaggi: [arcadia]
    luoghi: [domini-esterni]

  - id: alto-consiglio
    data: 91 s.P. / 0 A.C.
    titolo: L'Alto Consiglio
    rilievo: minore
    riassunto: |
      Il Capitano [[rodomonte]] scaccia il Cigno e consegna ad Arcadia la testa del presunto assassino di suo padre: la Prima Guerra Domiciliare finisce. [[arcadia]] abdica e istituisce un Alto Consiglio con rappresentanti di ogni Popolo, che la nomina Imperatrice Reggente della Casa. Da qui si contano gli anni "dell'Alto Consiglio" (A.C.).
    personaggi: [rodomonte, arcadia]
    luoghi: [astraviya]

  - id: apertura-frontiere
    data: 97 s.P. / VI A.C.
    titolo: L'Apertura delle Frontiere
    rilievo: maggiore
    riassunto: |
      Sei anni dopo la pace, con il Trattato di Astraviya, chiunque abbia documenti validi può finalmente viaggiare tra le Stanze senza limiti, nella speranza che i Popoli imparino a convivere. Molti giovani partono per studiare, lavorare o cercare avventura. **Comincia la Fragile Pace.**
    personaggi: [arcadia]
    luoghi: [reame, focolare, liberi-domini, orda]

  # ── LA NOSTRA SAGA DELLA FRAGILE PACE ─────────────────────
  #  Qui ci sono solo le avventure giocate al nostro tavolo.
  #  Sotto ogni avventura trovi "campagna: |": scrivi lì sotto,
  #  rientrato di due spazi in più, come è andata a finire.

  - id: cap-2-1
    data: Gen–Mar VII A.C.
    capitolo: Capitolo II · Paragrafo I
    titolo: Il Disastro del Corrimano
    rilievo: minore
    riassunto: |
      A gennaio la lussuosa Carovana del Corrimano precipita sui Gradini della Grande Scala. L'attentato è rivendicato dai **Liberissimi**, veterani dell'Esercito di Porcellana che non hanno mai accettato il Trattato di Astraviya e combattono per l'indipendenza del Primo Piano. La Carovana resta chiusa per mesi: chi vuole cambiare Piano deve affrontare la Grande Scala a piedi. In tutta la Casa si moltiplicano moti studenteschi, attacchi al potere e ribellioni, e anche i **Tristellati** tornano a farsi sentire.
    luoghi: [grande-scala, liberi-domini]

  - id: cap-2-2
    data: Apr VII – Mar VIII A.C.
    capitolo: Capitolo II · Paragrafo II
    titolo: Sulle tracce di Argo
    rilievo: minore
    riassunto: |
      Dopo il rocambolesco recupero della **Pagina Sigillata** del Diario del Burocrate [[argo]], [[gwen]] e [[humphrey]] seguono una vecchia mappa nella foresta di Pinewood, scoprendo che i Tristellati sono molto interessati alle stesse ricerche. A Beddingham, intanto, la prima di un'opera che allude alla Zarina finisce nel caos. Alla fine del periodo metà del gruppo è in prigione.
    avventure:
      - titolo: La Tomba di Argo
        quando: Maggio VII A.C.
        luogo: pinewood
        protagonisti: [gwen, humphrey, yuliya, icarus]
        altri: [flanagan]
        riassunto: |
          Il professor [[flanagan]] possiede una mappa che conduce a un luogo legato ad [[argo]] nella foresta di Pinewood. Visto l'interesse dei Tristellati per la pagina, il Reame manda a indagare anche [[yuliya]] e [[icarus]], che Flanagan mette in contatto con [[gwen]] e [[humphrey]]. Sotto una grande sfera di vetro bianca e rossa si apre una caverna piena di trappole: la tomba di una soladina che aveva custodito una pagina del Diario, con un ultimo messaggio: *cerca A Lume di Candela*. Sulla via del ritorno i Tristellati tendono un'imboscata.

          Tornati a Chesterfield, un infiltrato dei Tristellati fa arrestare Yuliya, Icarus e Humphrey con il pretesto della caccia di frodo, presentandosi con trenta soldati. Flanagan fa fuggire Gwen in segreto e la prega di continuare l'indagine.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.
      - titolo: La Regina e il Boggart
        quando: Giugno VII A.C.
        luogo: beddingham
        protagonisti: [jocelyne, pierre, earnest, sienna]
        altri: [korina, bardon, lestrade]
        riassunto: |
          [[pierre]] e [[jocelyne]], ormai visti di buon occhio dalla corte di Altaluce, sono mandati alla prima di *La Regina e il Boggart* per assicurarsi che gli autori dei Liberi Domini non infanghino l'onore della Zarina. [[sienna]] ha trascinato [[earnest]] a Beddingham per un lavoro da tuttofare nella compagnia teatrale: lui è diventato la controfigura del protagonista [[bardon]], lei ha "supervisionato" le gemme destinate alla corona di scena della prima attrice [[korina]].

          La sera della prima scoppia una rissa in sala e qualcuno prova a rapire Korina. Arriva l'ispettore [[lestrade]] con i rinforzi, e tutti i presenti finiscono in Gendarmeria. Alla fine [[pierre]] viene arrestato e mandato a Pozzoprofondo.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-3-1
    data: Apr–Lug VIII A.C.
    capitolo: Capitolo III · Paragrafo I
    titolo: La Grande Evasione
    rilievo: maggiore
    riassunto: |
      Ad aprile un gruppo di prigionieri sabota il Grande Coperchio di Pozzoprofondo e quasi tutti i detenuti fuggono: è la **Grande Evasione**. Molti evasi salgono nei Liberi Domini, dove non esiste l'estradizione, e la criminalità cresce in tutta la Casa. A maggio la Grande Biblioteca di Vascherdam viene distrutta da un incendio.
    luoghi: [penjara, vascherdam]
    avventure:
      - titolo: Fuga da Pozzoprofondo
        quando: Aprile VIII A.C.
        luogo: penjara
        protagonisti: [yuliya, pierre, icarus, humphrey]
        altri: [alisa-keeley, dall-soffer, desmond-colepot, paquita-ladrillo, betris-creel]
        riassunto: |
          Finiti a Pozzoprofondo per le trame dei Tristellati, [[yuliya]], [[pierre]], [[icarus]] e [[humphrey]] sopravvivono come possono negli anelli della prigione. L'acrobata [[alisa-keeley]] li contatta per organizzare una fuga, ma per aprire il Grande Coperchio serve il genio di [[dall-soffer]], prigioniero della banda di [[betris-creel]]. Per armarsi, trovare una strada nascosta e un modo di uscire dal deserto si rivolgono ad altri detenuti, come [[paquita-ladrillo]] e [[desmond-colepot]].

          Il gruppo riesce a fuggire. Con il Grande Coperchio sabotato, anche gran parte dei detenuti scappa con loro.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.
      - titolo: A Lume di Candela
        quando: Maggio VIII A.C.
        luogo: vascherdam
        protagonisti: [gwen, jocelyne, sienna, earnest]
        riassunto: |
          Fuggita da Chesterfield, [[gwen]] arriva nei Liberi Domini e, grazie agli amici di [[sienna]], si riunisce con lei, [[earnest]] e [[jocelyne]], che dopo l'arresto di Pierre cercano di tenersi lontani dalle autorità. Insieme cercano il libro *A Lume di Candela* nella sterminata Grande Biblioteca di Vascherdam, seguiti da qualcuno. La biblioteca va a fuoco, ma i quattro sopravvivono all'incendio e recuperano la pagina del Diario nascosta nel volume, scritta in un codice complicatissimo.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-3-2
    data: Ago VIII – Gen IX A.C.
    capitolo: Capitolo III · Paragrafo II
    titolo: Il Codice di Argo
    rilievo: minore
    riassunto: |
      Gli evasi di Pozzoprofondo cercano di rifarsi una vita, braccati dalle autorità e da chi li vuole zitti. Tra loro c'è [[dall-soffer]], tornato a Clockminster: un genio che ha aiutato, suo malgrado, la rivolta dei Tristellati, e che ora i Tristellati stessi vogliono eliminare.
    luoghi: [clockminster]
    avventure:
      - titolo: Il Codice di Argo
        quando: Settembre VIII A.C.
        luogo: clockminster
        protagonisti: [gwen, jocelyne, sienna, earnest]
        altri: [dall-soffer, claus-corden]
        riassunto: |
          La pagina trovata a Vascherdam è cifrata e solo un genio potrebbe leggerla. I contatti di [[sienna]] e i salotti frequentati da [[earnest]] e [[jocelyne]] portano a [[dall-soffer]], stanco e deciso a non immischiarsi più in nulla. Mentre si tratta con lui, arrivano i Liberissimi di [[claus-corden]] con una granata ticchettante, "con i ringraziamenti dei Tristellati".

          Soffer rivela che le pagine sono fatte per essere lette con un sistema di lenti colorate detto **gli Occhi della Mosca**, in possesso del famoso ingegnere [[paul-paquette]].
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-4-1
    data: Feb–Giu IX A.C.
    capitolo: Capitolo IIII · Paragrafo I
    titolo: Il Colpo del Secolo
    rilievo: maggiore
    riassunto: |
      L'anno IX A.C. è il centesimo dalla Scomparsa del Padrone: da Imbolc a Imbolc il Focolare celebra la **Festa dei Cent'anni** e tutta la Casa si unisce con fiere e spettacoli. A maggio una banda di criminali penetra nella Banca Centrale Domestica di Rosevault e sparisce con una fortuna in crì: è il **Colpo del Secolo**. Molti si ritrovano con i risparmi dimezzati, poste e trasporti rincarano e la Casa precipita in un tracollo finanziario. Arrivano sul mercato le prime armi a doppia canna.
    luoghi: [rosevault, cinderhall]
    avventure:
      - titolo: Il Colpo del Secolo
        quando: Maggio IX A.C.
        luogo: rosevault
        protagonisti: [yuliya, sienna, gwen, humphrey]
        altri: [ferguson-fole, oksana-diakovna, paul-paquette]
        riassunto: |
          Gli Occhi della Mosca sono nella cassetta di sicurezza di [[paul-paquette]], dentro la Banca Centrale Domestica di Rosevault, un luogo considerato inespugnabile. [[sienna]] chiama in aiuto un vecchio socio di Wallford, [[ferguson-fole]], che arriva con una decina di uomini e l'intenzione di arraffare tutti i crì possibili. [[gwen]] ha passato mesi a studiare la pianta della Banca, [[humphrey]] le Intercapedini attorno alla Specchiera per una via di fuga; a [[yuliya]] tocca trattare con la Marescialla [[oksana-diakovna]].

          La banda si divide tra chi entra dal salone principale e chi passa dalle Intercapedini, fino al Caveau e alle sue guardie meccaniche. Gli Occhi della Mosca rivelano che le pagine del Diario formano una mappa per il rifugio di [[argo]], nelle Intercapedini della Grande Scala.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-5-1
    data: Dic IX – Feb X A.C.
    capitolo: Capitolo V · Paragrafo I
    titolo: Il Gran Ballo di Yule
    rilievo: maggiore
    riassunto: |
      Come ogni anno il Marchese [[tristan-des-larmes]], la Fata Nera, apre il suo castello di Tournoire per il Gran Ballo di Yule, l'evento più esclusivo della Casa. Quest'anno i Tristellati sfruttano la festa per colpire. Dopo il Ballo il Reame dichiara lo **stato d'emergenza** e manda le Schiene Dorate a caccia di Tristellati in ogni angolo della Casa; i controlli diventano severissimi.
    luoghi: [tournoire]
    avventure:
      - titolo: Il Gran Ballo di Yule
        quando: Yule IX A.C.
        luogo: tournoire
        protagonisti: [jocelyne, pierre, earnest, icarus]
        altri: [tristan-des-larmes, ezra, amandine-roquefort, rashad-al-shakush, ashling-redgrave, abraham-mayweather, fifi]
        riassunto: |
          Su informazione di [[pierre]], le autorità imperiali pensano che il Ballo sia l'occasione giusta per scovare i collaboratori dei Tristellati nascosti tra i nobili, e incaricano lui e [[jocelyne]] di indagare. Li raggiungono [[earnest]], con il suo fascino innegabile, e [[icarus]], con una determinazione fuori dal comune e qualche trucco nuovo. Tra gli invitati ci sono la Generale [[amandine-roquefort]], lo Sceicco [[rashad-al-shakush]], la stilista [[ashling-redgrave]], il veterano [[abraham-mayweather]], il giovane barone [[ezra]] e l'attore [[fifi]].

          Il gruppo può muoversi tra gli ospiti o tra la servitù, mentre durante la serata i Tristellati tentano di colpire diversi invitati illustri.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-5-2
    data: Mar–Set X A.C.
    capitolo: Capitolo V · Paragrafo II
    titolo: Il Contratto di Dominio
    rilievo: minore
    riassunto: |
      Lo stato d'emergenza continua: le Schiene Dorate inseguono i Tristellati ovunque, anche tra le file dell'esercito. Dopo mesi di preparazione, il gruppo di Gwen raggiunge il laboratorio segreto del Burocrate [[argo]] sulla Grande Scala e scopre cosa custodiva.
    luoghi: [grande-scala]
    avventure:
      - titolo: Le Intercapedini Maledette
        quando: Settembre X A.C.
        luogo: grande-scala
        protagonisti: [gwen, humphrey, jocelyne, icarus]
        altri: [philippe, rosa]
        riassunto: |
          Dopo due settimane di cammino nelle Intercapedini, [[gwen]], [[humphrey]], [[jocelyne]] e [[icarus]] raggiungono l'ingresso del laboratorio di [[argo]]: una sala circolare con dieci porte, ognuna una prova legata ai Contratti, dal Distillatore dell'Ideale al Salone degli Applausi. Risolte le prove, il pavimento di resina si apre e rivela un grosso libro: **Il Contratto di Dominio**, un formulario che in teoria permette di controllare la Casa stessa. Sul retro della copertina: "Tu hai chiesto, la Casa risponde".

          All'uscita li aspettano quindici Tristellati guidati dal Capitano [[philippe]], che pretende il Contratto e il Diario in cambio della vita. Tra quei soldati si nasconde [[rosa]], una Medjay di Umbral. Philippe rivela che i suoi alleati sono pronti a infrangere la Finestra di Zucchero e invadere il Reame.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: cap-5-3
    data: Ottobre X A.C.
    capitolo: Capitolo V · Paragrafo III
    titolo: Cenere alla Cenere
    rilievo: minore
    riassunto: |
      Dopo le intromissioni dei Tristellati al Gran Ballo, il Reame manda le Schiene Dorate a Chesterfield. La popolazione mal sopporta i soldati stranieri, e [[furiospino]], per non cedere del tutto ad Astraviya, apre le porte di Cinderhall e chiede l'aiuto dei Cavalieri Cinerei. La città diventa una polveriera.
    luoghi: [chesterfield, cinderhall]
    avventure:
      - titolo: Cenere alla Cenere
        quando: Ottobre X A.C.
        luogo: chesterfield
        protagonisti: [sienna, earnest, yuliya, pierre]
        altri: [athelstan-whitefyre, sandon-blacksoot, gilford-grey, mary-alyanna-sighsmith, peyton-reed]
        riassunto: |
          La Zarina teme che la mossa sia troppo pesante e manda [[sienna]], [[earnest]], [[yuliya]] e [[pierre]] a Chesterfield per assicurarsi che non ci siano forze oscure all'opera. In città ci sono i tre Cavalieri Cinerei [[athelstan-whitefyre]], [[sandon-blacksoot]] e [[gilford-grey]]; gli studenti guidati da [[mary-alyanna-sighsmith]] hanno occupato il museo cittadino armati di vecchie posate da guerra; l'investigatore [[peyton-reed]] è costretto a prendere ordini da un Cavaliere. Il gruppo ha due giorni per disinnescare la polveriera, poi deve correre a Faeriyev.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.

  - id: caduta-faeriyev
    data: 21 Ottobre X A.C.
    capitolo: Epilogo
    titolo: La Caduta di Faeriyev
    rilievo: maggiore
    riassunto: |
      Il 21 ottobre X A.C. le **Fate Selvagge** dei Domini Esterni sfondano con gli arieti le Vetrate di Zucchero della Grande Finestra e invadono Faeriyev, la Città delle Stelle, con l'aiuto dei Tristellati rimasti nella città. Seguono tre giorni e tre notti di combattimenti che mettono in ginocchio il Reame. A guidare l'assalto sono la Generale [[morgana-astralta]] e suo fratello [[oberon-astralta]].
    luoghi: [faeriyev, domini-esterni]
    avventure:
      - titolo: Faeriyev, la Caduta
        quando: 21–23 Ottobre X A.C.
        luogo: faeriyev
        protagonisti: [gwen, humphrey, yuliya, icarus, jocelyne, pierre, earnest, sienna]
        altri: [tristan-des-larmes, rosa, alexei-puckevich, morgana-astralta, oberon-astralta, damien, theodore-kaczinsky]
        riassunto: |
          Grazie ai loro sforzi, tutti e otto arrivano a Faeriyev il pomeriggio prima dell'attacco, con il tempo di preparare qualche difesa insieme alle Schiene Dorate, a [[tristan-des-larmes]] con la sua guardia scelta e alla Medjay [[rosa]]. C'è da tenere il Belvedere, proteggere gli ascensori per evacuare la popolazione e difendere il Palazzo Ducale, dove il Duca [[alexei-puckevich]] deve resistere fino a potersi ricongiungere con l'esercito.

          Contro di loro: le Furie di [[morgana-astralta]], [[oberon-astralta]] deciso a catturare il Duca, i guerriglieri Tristellati di [[damien]], il 13° Battaglione Calabronato e il dinamitardo [[theodore-kaczinsky]], evaso da Pozzoprofondo.
        campagna: |
          # Come è finita? Scrivilo qui sotto, rientrato come questa riga.
