# ─────────────────────────────────────────────────────────────
#  PERSONALITÀ — protagonisti e figure della Casa
# ─────────────────────────────────────────────────────────────
#  • id: breve, minuscolo, senza spazi. È il nome usato
#    negli altri file (es. protagonisti: [gwen]).
#  • gruppo: decide in quale sezione compare il personaggio
#    ("I Protagonisti", "Figure della nostra Saga",
#    "Figure della Casa"…). Puoi inventarne altri.
#  • ritratto: percorso di un'immagine (facoltativo),
#    es. ritratti/gwen.webp
#  • luoghi: luoghi legati al personaggio (id di luoghi.yaml).
#  • campagna: come è cambiato il personaggio nella nostra Saga.
#    Le righe che iniziano con # non vengono mostrate.
# ─────────────────────────────────────────────────────────────

# ── I PROTAGONISTI ─────────────────────────────────────────

- id: gwen
  nome: Gwen Summers
  gruppo: I Protagonisti
  popolo: Boggart
  nazione: Focolare
  mestiere: Erudito · Ricercatore
  eta: 24
  breve: Bibliotecaria di Wallford ossessionata dal Burocrate Argo.
  luoghi: [wallford, beddingham]
  profilo: |
    Nipote di boggart che si erano inginocchiati a Oberon pur di restare in Casa, è cresciuta a Beddingham nel banco dei pegni di famiglia, tra oggetti di ogni epoca e popolo. Lì è nata la sua grande ossessione: gli studi del Burocrate [[argo]], che avrebbe imbrigliato il potere dei Contratti. Dopo la guerra ha studiato Storia, Filosofia e Cartografia a Wallford, dove lavora come bibliotecaria. Impacciata, estroversa, curiosa e un po' ingenua.
  campagna: |
    # Scrivi qui come è cambiata Gwen nella vostra Saga.

- id: humphrey
  nome: Humphrey Lockwood
  gruppo: I Protagonisti
  popolo: Boggart
  nazione: Focolare
  mestiere: Cacciatore · Solitario
  eta: 23
  breve: Cacciatore silenzioso che non si immischia negli affari altrui.
  luoghi: [bookshire, pinewood, wallford]
  profilo: |
    Ultimo di cinque fratelli di una famiglia di cacciatori di Bookshire, in faida con i Flammel. Da ragazzo ha stretto un'amicizia segreta con Litha Flammel; la sera in cui dovevano fuggire insieme lei non si è presentata e lui è partito da solo. Da tre anni fa la spola tra Pinewood e Wallford, vende le sue prede senza contrattare e non porta i colori di nessun Covo.
  campagna: |
    # Scrivi qui come è cambiato Humphrey nella vostra Saga.

- id: yuliya
  nome: Yuliya Dragomirov
  nome_completo: Yuliya Fedorovna Dragomirov
  gruppo: I Protagonisti
  popolo: Fata
  nazione: Reame
  mestiere: Duellante · Capitano
  eta: 28
  breve: Sergente del Grande Esercito Imperiale, gelida e determinata.
  luoghi: [faeriyev, astraviya]
  profilo: |
    Figlia di un Maresciallo che non le ha mai perdonato di non essere un maschio, è cresciuta a Faeriyev studiando le mappe di guerra del padre. Quando [[arcadia]] è salita al trono ha capito che nessuno poteva dirle cosa fare. Diplomata alla Scuola di Scherma del Reame, è diventata Sergente a Sottoluce. Rifiuta ogni posto a palazzo: il suo posto è sul campo.
  campagna: |
    # Scrivi qui come è cambiata Yuliya nella vostra Saga.

- id: icarus
  nome: Icarus König
  gruppo: I Protagonisti
  popolo: Fata
  nazione: Reame
  mestiere: Cacciatore · Sentinella
  eta: 22
  breve: Sentinella del Grande Esercito Imperiale, figlio dei vicoli di Unter.
  luoghi: [unter, glasburg, la-ruelle]
  profilo: |
    Cresciuto povero a Unter, da bambino faceva mille lavori per pagare le cure della sorellina Thalia, morta il giorno in cui finì la guerra. Con quei risparmi i genitori gli hanno pagato l'Accademia Militare di Glasburg, dove il Sergente Ludwig Teelöffel è stato per lui un secondo padre. Ora è di stanza a La Ruelle, in attesa di partire per il Lungo Corridoio.
  campagna: |
    # Scrivi qui come è cambiato Icarus nella vostra Saga.

- id: jocelyne
  nome: Jocelyne Bonheur
  gruppo: I Protagonisti
  popolo: Fata
  nazione: Reame
  mestiere: Criminale · Cortigiana
  eta: 24
  breve: Cortigiana scaltra di Sottoluce, orfana della rivolta dei Tristellati.
  luoghi: [mont-guignol, astraviya]
  profilo: |
    Rimasta orfana quando i Tristellati colpirono la madre, sposata a un ondino, è cresciuta per strada tra bari e saltimbanchi. Allegra e spregiudicata, è arrivata ad Astraviya sognando i teatri; dopo pochi provini falliti è entrata nel giro delle tresche e lavora come cortigiana a Sottoluce, specializzata in mariti infedeli da ricattare.
  campagna: |
    # Scrivi qui come è cambiata Jocelyne nella vostra Saga.

- id: pierre
  nome: Pierre Delacroyance
  nome_completo: Pierre Armand Delacroyance
  gruppo: I Protagonisti
  popolo: Fata
  nazione: Reame
  mestiere: Erudito · Diplomatico
  eta: 41
  breve: Tutore raffinato e snob, diplomatico abilissimo ma ingenuo.
  luoghi: [mont-guignol, tournoire, la-ruelle]
  profilo: |
    Discendente minore di servitori di Oberon, è cresciuto tra Mont Guignol e Tournoire, nel lusso del Pianoforte. Laureato in Diplomazia, Galateo e Arte Amatoria, è riuscito a evitare sia la leva sia la guerra, e un caso fortunato lo ha portato lontano dal Pianoforte quattro giorni prima della rivolta dei Tristellati. Tutore ricercatissimo, si fida ciecamente del suo segretario, il silfide Gunther Lichtmann.
  campagna: |
    # Scrivi qui come è cambiato Pierre nella vostra Saga.

- id: earnest
  nome: Earnest Gilmore
  gruppo: I Protagonisti
  popolo: Boggart
  nazione: Focolare
  mestiere: Duellante · Eroe
  eta: 23
  breve: Duellante di buon cuore, sempre pronto a tirare Sienna fuori dai guai.
  luoghi: [wallford]
  profilo: |
    Figlio di un falegname di Wallford che ha perso in guerra il figlio maggiore, sognava di diventare un duellante come quelli delle storie. Contro il volere del padre si è diplomato all'Accademia di Scherma, ma per un duellante di umili origini il lavoro è poco: fa il riscossore di crediti gentile e il campione sostituto nei duelli d'onore. Ha giurato di proteggere [[sienna]], qualunque cosa accada.
  campagna: |
    # Scrivi qui come è cambiato Earnest nella vostra Saga.

- id: sienna
  nome: Sienna Blackwell
  nome_completo: Sienna Veronica Blackwell
  gruppo: I Protagonisti
  popolo: Boggart
  nazione: Focolare
  mestiere: Criminale · Ladra
  eta: 21
  breve: Ladra di Wallford con una faccia tosta proverbiale.
  luoghi: [wallford]
  profilo: |
    Cresciuta dalla nonna Margaret, che le ha insegnato che è meglio chiedere "scusa" che "per favore", a dieci anni era già preziosa per tutte le tresche di Wallford. Da bambina, sorpresa a rubare nella bottega dei Gilmore, convinse [[earnest]] di essere un'agente segreta della Zarina: da allora sono amici inseparabili. Lavora per tutte le tresche senza schierarsi con nessuna, e tutti hanno un conto in sospeso con lei.
  campagna: |
    # Scrivi qui come è cambiata Sienna nella vostra Saga.

# ── FIGURE DELLA NOSTRA SAGA ───────────────────────────────
#  Personaggi incontrati nelle nostre avventure.
#  Ho scritto solo ciò che i protagonisti sapevano all'inizio:
#  aggiungi tu i segreti che hanno scoperto.

- id: flanagan
  nome: Noam Flanagan
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Soladino)
  nazione: Focolare
  breve: Erudito, sindaco e rettore di Chesterfield by-the-fire.
  luoghi: [chesterfield]
  profilo: |
    Il professor Flanagan è sindaco di Chesterfield by-the-fire e rettore della sua Università. Esperto di [[argo]], possedeva la vecchia mappa che portò [[gwen]] e [[humphrey]] alla tomba nascosta di Pinewood. Quando i Tristellati fecero arrestare i compagni di Gwen, fu lui a farla fuggire in segreto.

- id: korina
  nome: Korina Chyórnaya
  nome_completo: Korina Fyodorovna Chyórnaya
  gruppo: Figure della nostra Saga
  popolo: Fata
  nazione: Reame
  breve: Prima attrice de "La Regina e il Boggart", figlia di un colonnello del Reame.
  luoghi: [beddingham]
  profilo: |
    Prosperosa fata dalla chioma bionda, interpreta la Regina nell'opera che debuttò a Beddingham. Le sue doti di attrice sono discutibili, e le sue attenzioni per [[earnest]] non passarono inosservate.

- id: bardon
  nome: Bardon Havrés
  gruppo: Figure della nostra Saga
  popolo: Sluagh
  breve: Attore protagonista de "La Regina e il Boggart", dal fascino rude.
  luoghi: [beddingham]
  profilo: |
    Sluagh del Bathur, interpreta il Boggart dell'opera. [[earnest]] lavorò come sua controfigura nelle scene d'azione.

- id: lestrade
  nome: Gregory Lestrade
  gruppo: Figure della nostra Saga
  breve: Ispettore della Gendarmeria di Beddingham.
  luoghi: [beddingham]
  profilo: |
    Arrivò con i rinforzi a fermare la rissa scoppiata alla prima de "La Regina e il Boggart" e portò tutti i presenti in Gendarmeria per interrogarli.

- id: alisa-keeley
  nome: Alisa Keeley
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Silfide)
  breve: Ex circense e ladra acrobata, prigioniera a Pozzoprofondo.
  luoghi: [penjara]
  profilo: |
    Silfide alta e slanciata, dai tratti ancora più eterei del solito. Fu lei a contattare i protagonisti prigionieri per organizzare la fuga da Pozzoprofondo.

- id: dall-soffer
  nome: Dall Soffer
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Silfide)
  breve: Genio della meccanica, stanco e sconfitto dalla vita.
  luoghi: [penjara, clockminster]
  profilo: |
    Silfide di mezza età, goffo e sempre spettinato, è un genio della tecnica e delle armi da fuoco. Durante la guerra fu costretto ad aiutare la rivolta dei Tristellati, e per questo finì a Pozzoprofondo. Solo lui sapeva aggirare il Grande Coperchio della prigione. Dopo la Grande Evasione tornò a Clockminster per rifarsi una vita, ma i Tristellati lo volevano morto. Fu lui a spiegare come leggere le pagine del Diario di [[argo]].

- id: betris-creel
  nome: Betris Creel
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Ondina)
  breve: Anziana boss del terzo anello dal fondo di Pozzoprofondo.
  luoghi: [penjara]
  profilo: |
    Ondina dal volto rugoso e dai modi autoritari. La sua banda di criminali violenti teneva prigioniero [[dall-soffer]]; i suoi uomini le sono fedeli più per paura che per lealtà.

- id: chezlav-lazarov
  nome: Chezlav Lazarov
  gruppo: Figure della nostra Saga
  popolo: Fata
  breve: Contrabbandiere di Pozzoprofondo.
  luoghi: [penjara]
  profilo: |
    Fata dai capelli rasati e dal viso pieno di cicatrici, individualista e approfittatore. In prigione può procurare armi, in cambio di favori.

- id: paquita-ladrillo
  nome: Paquita Ladrillo
  gruppo: Figure della nostra Saga
  popolo: Sluagh
  breve: Detenuta che conosceva una strada segreta tra le celle vuote.
  luoghi: [penjara, el-paso-de-umbral]
  profilo: |
    Sluagh dalla pelle rosso acceso con grandi lentiggini nere, due corte antenne, una cascata di capelli biondi e un temperamento focoso. Finita a Pozzoprofondo per aver avvelenato il marito ratador che la tradiva, aveva scoperto un percorso tra le celle vuote fino al Grande Coperchio.

- id: desmond-colepot
  nome: Desmond Colepot
  gruppo: Figure della nostra Saga
  popolo: Boggart
  breve: Allevatore allegro, finito in prigione per aver venduto topi malati a un Emiro.
  luoghi: [penjara]
  profilo: |
    Boggart robusto dal viso tondo e dai baffi ben curati. Sapeva come ammansire i pipistrelli addestrati della prigione e fuggire in volo dalla Voliera Esterna.

- id: claus-corden
  nome: Claus Corden
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Ondino)
  breve: Capo di una banda di Liberissimi.
  luoghi: [clockminster]
  profilo: |
    Ondino dai tratti rudi, sovrappeso e sboccato. Si presentò da [[dall-soffer]] con i suoi duellanti e una granata ticchettante "con i ringraziamenti dei Tristellati".

- id: paul-paquette
  nome: Paul Paquette
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Soladino)
  breve: Famoso ingegnere, proprietario degli Occhi della Mosca.
  luoghi: [rosevault]
  profilo: |
    Custodiva nella sua cassetta di sicurezza alla Banca Centrale Domestica di Rosevault gli Occhi della Mosca, un sistema di lenti colorate sovrapposte: l'unico strumento capace di leggere le pagine del Diario di [[argo]].

- id: ferguson-fole
  nome: Ferguson Fole
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Silfide)
  nazione: Focolare
  breve: Criminale di Wallford, vecchio socio di Sienna.
  luoghi: [wallford, rosevault]
  profilo: |
    Silfide dalla carnagione blu scuro, vecchia conoscenza di [[sienna]], con cui aveva fatto qualche "lavoro" anni prima. Rispose alla sua chiamata e portò a Rosevault una decina dei suoi uomini per il Colpo del Secolo, con l'idea di arraffare ogni crì possibile.

- id: oksana-diakovna
  nome: Oksana Diakovna
  gruppo: Figure della nostra Saga
  popolo: Fata
  breve: La Marescialla, a guardia della Banca di Rosevault.
  luoghi: [rosevault]
  profilo: |
    Responsabile della sicurezza della Banca Centrale Domestica. Durante il Colpo del Secolo toccò a [[yuliya]] prendere contatto con lei.

- id: ezra
  nome: Ezra Filibert Lunemberg-Flaschestein
  gruppo: Figure della nostra Saga
  popolo: Fata
  nazione: Reame
  breve: Giovane barone della Credenza, abile schermidore.
  luoghi: [tournoire, glasburg]
  profilo: |
    Invitato al Gran Ballo di Yule, maneggia con grande abilità la mezzaforbicina.

- id: amandine-roquefort
  nome: Amandine Roquefort
  gruppo: Figure della nostra Saga
  popolo: Fata
  nazione: Reame
  breve: Generale del Grande Esercito Imperiale.
  luoghi: [tournoire]
  profilo: |
    Fata sulla quarantina, bionda platino con un taglio corto da soldato. Era al Gran Ballo di Yule perché temeva un attentato dei Tristellati, e sorvegliava di persona le mura durante la festa. Aprì le danze con il Marchese.

- id: rashad-al-shakush
  nome: Rashad al Shakush
  gruppo: Figure della nostra Saga
  popolo: Sluagh
  nazione: Orda
  breve: Sceicco di Al Sehir, poeta e fine conversatore.
  luoghi: [al-sehir, tournoire]
  profilo: |
    Pelle blu scuro, lunghe antenne rossastre, barba e baffi perfetti. Ospite illustre del Gran Ballo di Yule.

- id: ashling-redgrave
  nome: Ashling Redgrave
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Soladina)
  nazione: Liberi Domini
  breve: Stilista premiatissima, autrice dell'abito del Marchese.
  luoghi: [tournoire]
  profilo: |
    Bassa di statura e di carattere focoso, capelli arancioni e una cascata di lentiggini; il suo abito stravagante nasconde dei metri da sarta. Al Gran Ballo litigò con alcuni stilisti rivali.

- id: abraham-mayweather
  nome: Abraham Mayweather
  gruppo: Figure della nostra Saga
  breve: Veterano rispettato dalle forze armate.
  luoghi: [tournoire]
  profilo: |
    Servì sotto Jules des Larmes e lo ricorda con affetto. La sua fama di veterano lo rende un punto di riferimento per i soldati del Reame. Invitato al Gran Ballo di Yule.

- id: fifi
  nome: Fiordaliso de Fifre, detto Fifì
  gruppo: Figure della nostra Saga
  popolo: Fata
  breve: Giovane attore libertino e civettuolo.
  luoghi: [tournoire]
  profilo: |
    Ventenne dai capelli nerissimi, pelle pallida e ali quasi trasparenti. Al Gran Ballo di Yule cercò in tutti i modi di farsi mantenere da [[pierre]].

- id: philippe
  nome: Philippe Lunemberg-Flaschestein
  gruppo: Figure della nostra Saga
  popolo: Fata
  breve: Capitano dei Tristellati, fratello di Ezra.
  luoghi: [grande-scala]
  profilo: |
    Guidò i quindici Tristellati che attesero i protagonisti all'uscita del laboratorio di Argo, pretendendo il Contratto di Dominio e il Diario. Fu lui a rivelare che i suoi alleati stavano per infrangere la Finestra di Zucchero.

- id: rosa
  nome: Rosa di Umbral
  gruppo: Figure della nostra Saga
  popolo: Sluagh
  breve: Medjay, infiltrata tra i Tristellati.
  luoghi: [el-paso-de-umbral, grande-scala, faeriyev]
  profilo: |
    Membro dell'Ordine dei Medjay, si era camuffata tra i soldati di [[philippe]] nelle Intercapedini della Grande Scala. Era al fianco dei protagonisti nella difesa di Faeriyev.

- id: athelstan-whitefyre
  nome: Sir Athelstan Whitefyre
  gruppo: Figure della nostra Saga
  popolo: Boggart
  nazione: Focolare
  breve: Cavaliere Cinereo inviato a Chesterfield.
  luoghi: [cinderhall, chesterfield]
  profilo: |
    Boggart di mezza età ma ancora molto prestante, valoroso, più volte fedele al Focolare e all'Ordine Cinereo.

- id: sandon-blacksoot
  nome: Sir Sandon Blacksoot
  gruppo: Figure della nostra Saga
  popolo: Boggart
  nazione: Focolare
  breve: Cavaliere Cinereo al comando della Gendarmeria di Chesterfield.
  luoghi: [cinderhall, chesterfield]
  profilo: |
    Il più anziano dei tre Cavalieri, burbero, con baffi neri come il carbone. Perde spesso la pazienza e non trattiene la sua chiave-mazza con chi gli manca di rispetto.

- id: gilford-grey
  nome: Sir Gilford Grey
  gruppo: Figure della nostra Saga
  popolo: Boggart
  nazione: Focolare
  breve: Il più giovane dei tre Cavalieri Cinerei.
  luoghi: [cinderhall, chesterfield]
  profilo: |
    Bel ragazzo dai capelli lunghi, ha un debito di vita con il Gran Maestro [[edward-ashworth]]. Si era avvicinato agli studenti in protesta a Chesterfield.

- id: mary-alyanna-sighsmith
  nome: Mary Alyanna Sighsmith
  gruppo: Figure della nostra Saga
  popolo: Boggart
  nazione: Focolare
  breve: Leader degli studenti in protesta a Chesterfield.
  luoghi: [chesterfield]
  profilo: |
    Boggart di 26 anni, biondissima, con occhi verdi come Pinewood e l'animo ardente del Camino. Con i suoi aveva occupato l'ala della Posateria di Guerra del museo cittadino, minacciando di insorgere.

- id: peyton-reed
  nome: Peyton Reed
  gruppo: Figure della nostra Saga
  popolo: Boggart
  nazione: Focolare
  breve: Investigatore della Gendarmeria di Chesterfield.
  luoghi: [chesterfield]
  profilo: |
    Veterano e uomo di legge da lungo tempo, mal sopportava gli ordini di [[sandon-blacksoot]], ma era troppo ligio all'uniforme per disobbedire a un Cavaliere.

- id: morgana-astralta
  nome: Morgana Astralta
  gruppo: Figure della nostra Saga
  popolo: Fae
  nazione: Giardino
  breve: Generale delle Fate Selvagge, al comando delle Furie.
  luoghi: [faeriyev, domini-esterni]
  profilo: |
    Generale della V Legione Ribelle Nova Scorpio della Corte dei Seelie. Le sue Furie, guerriere armate di falci d'osso, guidarono l'assalto al Belvedere di Faeriyev.

- id: oberon-astralta
  nome: Oberon Astralta
  gruppo: Figure della nostra Saga
  popolo: Fae
  nazione: Giardino
  breve: Schiena Dorata dei Fae, fratello di Morgana.
  luoghi: [faeriyev, domini-esterni]
  profilo: |
    Occhi scuri, capelli color rame, un'uniforme impeccabile verde e viola e grandi ali rosso scuro, come sangue denso. Durante la Caduta di Faeriyev aveva un unico obiettivo: catturare il Duca [[alexei-puckevich]].

- id: damien
  nome: Damien Lunemberg-Flaschestein
  gruppo: Figure della nostra Saga
  popolo: Fata
  breve: Capo dei guerriglieri Tristellati di Faeriyev.
  luoghi: [faeriyev]
  profilo: |
    Cugino di [[ezra]] e [[philippe]], ha lavorato nell'ombra per anni aspettando il suo momento. Durante la Caduta di Faeriyev guidò la cellula tristellata della città.

- id: theodore-kaczinsky
  nome: Theodore "Una" Kaczinsky
  gruppo: Figure della nostra Saga
  popolo: Sprigo (Soladino)
  breve: Dinamitardo tristemente famoso, evaso da Pozzoprofondo.
  luoghi: [faeriyev, penjara]
  profilo: |
    Noto in tutta la Casa per svariati attentati con esplosivi, fuggì da Pozzoprofondo durante la Grande Evasione. A Faeriyev guidò il sabotaggio degli ascensori.

# ── FIGURE DELLA CASA ──────────────────────────────────────

- id: big-ben
  nome: Benjamin "Big Ben" Hearthworth
  gruppo: Figure della Casa
  popolo: Boggart
  breve: Il boggart che giurò di custodire la Casa in attesa del Padrone.
  luoghi: [salone, grande-scala]
  profilo: |
    Fu il primo ad accorgersi della Scomparsa del Padrone e guidò i Boggart nella guerra contro gli Sprighi. Cadde nella Battaglia della Grande Scala, tradito da [[paracelso]]. Le luci di Beddingham furono un suo dono agli Sprighi, in occasione di una tregua ancora celebrata il 24 dicembre.

- id: paracelso
  nome: Mastro Paracelso
  gruppo: Figure della Casa
  popolo: Sprigo
  breve: Lo Sprigo della Polvere, fondatore dei Liberi Domini.
  luoghi: [liberi-domini, beddingham, clockminster]
  profilo: |
    Guidò gli Sprighi nella conquista del Primo Piano e fondò l'Università di Clockminster. Nella Battaglia della Grande Scala si accordò con Oberon e tradì [[big-ben]]: per i Boggart è il responsabile del Grande Tradimento. Siede nell'Alto Consiglio come Portavoce dei Liberi Domini.

- id: oberon
  nome: Oberon Trismegisto
  gruppo: Figure della Casa
  popolo: Fata
  breve: Lo Zar che portò le Fate nella Casa e divenne Imperatore.
  luoghi: [faeriyev, astraviya, domini-esterni]
  profilo: |
    Guidò le Fate dalla Grande Finestra dopo la caduta di Déndronaos e fondò il Reame. Dopo la Grande Scala regnò come Imperatore della Casa, combatté gli Sluagh e strinse con i Boggart il Patto di Restaurazione. Fu assassinato nell'83 s.P.

- id: arcadia
  nome: Arcadia Oberonovna
  gruppo: Figure della Casa
  popolo: Fata
  nazione: Reame
  breve: Zarina del Reame e Imperatrice Reggente della Casa.
  luoghi: [astraviya]
  profilo: |
    Figlia di [[oberon]], salì al trono giovanissima. Con l'Editto "Fratelli!" dichiarò tutti gli omini un'unica stirpe, scatenando la rivolta dei Tristellati. Dopo la guerra abdicò per creare l'Alto Consiglio, che la nominò Imperatrice Reggente. Aprì le frontiere dando inizio alla Fragile Pace.

- id: ludmillen
  nome: Ludmillen Vonnhoimar-Eudoxia
  gruppo: Figure della Casa
  popolo: Fata
  nazione: Reame
  breve: La Stella d'Argento, Gran Generale e Duca di Sottoluce.
  luoghi: [astraviya]
  profilo: |
    La Fata più vecchia della Casa, Capitano delle Schiene Dorate e Gran Generale del Grande Esercito Imperiale. Rifiutò la corona dopo la morte di Oberon.

- id: tristan-des-larmes
  nome: Tristan des Larmes
  gruppo: Figure della Casa
  popolo: Fata
  nazione: Reame
  breve: La Fata Nera, Marchese di Tournoire.
  luoghi: [tournoire, faeriyev]
  profilo: |
    Da giovane sconfisse i Tristellati che avevano occupato il Pianoforte. Vive nel Castello d'Ebano, lasciato volutamente segnato dalla battaglia, e ogni anno ospita il Gran Ballo di Yule. Combatté con la sua guardia scelta nella difesa di Faeriyev.

- id: alexei-puckevich
  nome: Alexei Puckevich
  nome_completo: Alexei Puckevich Stakan-Eudoxia
  gruppo: Figure della Casa
  popolo: Fata
  nazione: Reame
  breve: Duca della Finestra, comandante in capo dell'esercito del Reame.
  luoghi: [faeriyev]
  profilo: |
    Signore di Faeriyev, Capitano delle Schiene Dorate e uno dei migliori duellanti della Casa. Durante la Caduta della città il suo palazzo fu assediato dalle Fate Selvagge.

- id: rodomonte
  nome: Capitano Rodomonte
  gruppo: Figure della Casa
  popolo: Sluagh
  nazione: Orda
  breve: Khan dell'Orda, mise fine alla Prima Guerra Domiciliare.
  luoghi: [orda]
  profilo: |
    Scacciò il Cigno e portò ad Arcadia la testa del presunto assassino di Oberon, chiudendo la guerra. Siede nell'Alto Consiglio come rappresentante degli Sluagh.

- id: william-hearthworth
  nome: William Benjamin Hearthworth
  gruppo: Figure della Casa
  popolo: Boggart
  nazione: Focolare
  breve: Nipote di Big Ben, riportò i Boggart al Focolare.
  luoghi: [focolare]
  profilo: |
    Guidò il ritorno dei Boggart nella Casa dopo il Patto di Restaurazione e li condusse nella Prima Guerra Domiciliare.

- id: furiospino
  nome: Furiospino
  nome_completo: William Hearthworth Jr., detto Furiospino
  gruppo: Figure della Casa
  popolo: Boggart
  nazione: Focolare
  breve: Giovane Governatore e Guardiano del Focolare.
  luoghi: [wallford, focolare]
  profilo: |
    Governatore e Gran Generale del Focolare, siede nell'Alto Consiglio come Guardiano del Focolare. Molti lo considerano troppo accondiscendente verso il Reame. Nel X A.C., per non cedere del tutto ad Astraviya, aprì le porte di Cinderhall e chiamò i Cavalieri Cinerei a Chesterfield.

- id: edward-ashworth
  nome: Edward Ashworth
  gruppo: Figure della Casa
  popolo: Boggart
  nazione: Focolare
  breve: Il Tristo Cavaliere, Gran Maestro dei Cavalieri Cinerei.
  luoghi: [cinderhall]
  profilo: |
    Salì i Gradini del Camino e ne uscì avvolto dalla prima armatura cinerea, simbolo della rinascita dei Boggart. Da Cinderhall guida l'Ordine Cinereo.

- id: argo
  nome: Argo
  nome_completo: Il Burocrate Argo
  gruppo: Figure della Casa
  breve: Studioso leggendario dei Contratti e del loro potere.
  luoghi: [clockminster, grande-scala]
  profilo: |
    Dedicò la vita a studiare i Contratti per comprenderne e usarne il potere. Dopo la sua morte prematura si diffuse la voce che le sue scoperte fossero custodite in un diario. Le pagine, coperte di cera e scritte in codice, erano disperse per la Casa e cercate da studiosi e Tristellati. Il suo laboratorio segreto, nelle Intercapedini della Grande Scala, custodiva il Contratto di Dominio.
